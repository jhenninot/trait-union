# Trait d'union : pile à coller dans Dockge.
# L'image est construite par GitHub Actions et publiée sur ghcr.io à chaque push sur main.
# Watchtower ne met à jour que les conteneurs portant le label
# com.centurylinklabs.watchtower.enable=true (ici, uniquement l'application).
#
# Variables à définir dans l'onglet « .env » de la pile Dockge (voir .env.example) :
#   POSTGRES_PASSWORD=un-mot-de-passe-long
# Facultatif, pour la connexion avec Google et les liens des emails (voir README) :
#   APP_URL=https://trait-union.mondomaine.fr
#   GOOGLE_CLIENT_ID=...apps.googleusercontent.com
#   GOOGLE_CLIENT_SECRET=...
# L'envoi d'emails (Brevo) et le stockage des photos (S3, ex. OVHcloud Object Storage)
# se configurent dans l'application, écrans d'administration. Les photos ne sont pas
# stockées sur ce serveur : aucun volume à prévoir pour elles.
# Alertes (rappels de rendez-vous, nouvelles photos) : rien à ajouter ici. Le Web Push des
# navigateurs et de la PWA marche tout seul (clés créées en base au premier démarrage) ; pour
# l'application Android, le compte de service Firebase se saisit dans Administration, Alertes.
# Le serveur doit pouvoir joindre internet en HTTPS (services de notification de Google,
# Mozilla et Apple) ; les rappels sont calculés à l'heure de TZ ci-dessous.

services:
  app:
    image: ghcr.io/jhenninot/trait-union:latest
    container_name: trait-union
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Paris
      DATABASE_URL: postgres://traitunion:${POSTGRES_PASSWORD:?à définir dans le .env}@db:5432/traitunion
      APP_URL: ${APP_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true

  db:
    # Pas de label Watchtower : une montée de version de Postgres se fait à la main.
    image: postgres:17-alpine
    container_name: trait-union-db
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      POSTGRES_USER: traitunion
      POSTGRES_DB: traitunion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans le .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traitunion -d traitunion"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    # Fork maintenu de containrrr/watchtower (archivé, incompatible avec Docker 29)
    image: nickfedor/watchtower:latest
    container_name: trait-union-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Décommenter si le paquet GHCR devient privé (après un `docker login ghcr.io` sur l'hôte)
      # - /root/.docker/config.json:/config.json:ro
    environment:
      TZ: Europe/Paris
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"

volumes:
  db-data:
